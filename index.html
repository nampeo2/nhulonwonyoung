<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giờ Làm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #08090d;
  --surface:  #0e1018;
  --card:     #12151e;
  --card2:    #181c27;
  --border:   #1e2438;
  --border2:  #262d42;
  --text:     #dde2f0;
  --dim:      #8b95b0;
  --muted:    #4a5370;
  --accent:   #4f7eff;
  --accent-d: #162247;
  --green:    #23d18b;
  --green-d:  #0b2e1e;
  --red:      #f05050;
  --red-d:    #2e0b0b;
  --amber:    #f5a623;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 40px;
}

/* ─── Noise texture overlay ─── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.6;
}

/* ─── Header ─── */
.app-header {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 22px 18px 10px;
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.brand-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
}

.brand-date {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--mono);
}

.live-clock {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 500;
  color: var(--dim);
  letter-spacing: 1px;
  line-height: 1;
  padding-top: 3px;
}

/* ─── Cards ─── */
.card {
  position: relative;
  z-index: 1;
  background: var(--card);
  margin: 0 12px 10px;
  padding: 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
}

/* ─── Timer card ─── */
.timer-card {
  overflow: hidden;
}

.timer-card::after {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-d) 0%, transparent 70%);
  pointer-events: none;
}

.status-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 10px;
}

.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}

.status-dot.active {
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: blink-dot 2.2s ease-in-out infinite;
}

@keyframes blink-dot {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.35; }
}

.status-label {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.timer-display {
  font-family: var(--mono);
  font-size: 48px;
  font-weight: 400;
  letter-spacing: -1px;
  color: var(--dim);
  line-height: 1;
  margin-bottom: 18px;
  transition: color 0.3s;
}

.timer-display.active {
  color: var(--green);
}

.ctrl-row {
  display: flex;
  gap: 10px;
}

.ctrl-btn {
  flex: 1;
  padding: 15px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--sans);
  letter-spacing: 0.2px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #fff;
}

.ctrl-btn .btn-icon {
  font-size: 16px;
  line-height: 1;
}

.start-btn { background: var(--green); color: #000; }
.stop-btn  { background: var(--red); }

.ctrl-btn:disabled {
  opacity: 0.28;
  cursor: not-allowed;
  transform: none !important;
  filter: none !important;
}

.ctrl-btn:not(:disabled):hover  { filter: brightness(1.12); transform: translateY(-1px); }
.ctrl-btn:not(:disabled):active { transform: translateY(0); }

/* ─── Session card header ─── */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 8px;
}

.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.header-actions { display: flex; gap: 6px; }

.btn-sm {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card2);
  color: var(--dim);
  font-size: 12px;
  font-weight: 500;
  font-family: var(--sans);
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
}

.btn-sm:hover:not(:disabled) {
  border-color: var(--border2);
  color: var(--text);
  background: #1e2333;
}

.btn-sm.export-btn {
  border-color: #1a3a25;
  background: var(--green-d);
  color: var(--green);
}

.btn-sm.export-btn:hover {
  background: #0f3321;
  border-color: #1f4a30;
}

/* ─── Summary chips ─── */
.summary-bar {
  display: flex;
  gap: 7px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.s-chip {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 12px;
  color: var(--muted);
  font-family: var(--mono);
  display: flex;
  align-items: center;
  gap: 4px;
}

.s-chip .val { color: var(--text); font-weight: 500; }

/* ─── Sort chips ─── */
.sort-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  align-items: center;
}

.sort-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-right: 2px;
}

.sort-chip {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  font-family: var(--sans);
  cursor: pointer;
  transition: all 0.18s;
}

.sort-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.sort-chip:hover:not(.active) {
  border-color: var(--border2);
  color: var(--dim);
}

/* ─── Session list ─── */
#sessionList {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.session-item {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 11px 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color 0.2s;
}

.session-item:hover { border-color: var(--border2); }

.session-item.open-session {
  border-color: #1a3f28;
  background: linear-gradient(135deg, #0c1f14 0%, #0f1a1a 100%);
}

.session-fields {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  flex: 1;
  min-width: 0;
}

.session-sep { color: var(--muted); font-size: 12px; }

.session-dur {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  padding: 3px 8px;
  background: var(--surface);
  border-radius: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}

.session-dur.live {
  color: var(--green);
  background: var(--green-d);
}

input[type=date], input[type=time] {
  padding: 5px 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 12px;
  font-family: var(--mono);
  outline: none;
  transition: border-color 0.18s;
}

input[type=date]:focus, input[type=time]:focus {
  border-color: var(--accent);
}

.btn-del {
  padding: 6px 8px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.18s;
  flex-shrink: 0;
}

.btn-del:hover {
  background: var(--red-d);
  color: var(--red);
}

/* Empty */
.empty-state {
  text-align: center;
  padding: 36px 16px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}

.empty-icon { font-size: 28px; display: block; margin-bottom: 8px; }

/* ─── Animations ─── */
@keyframes slideFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes highlight   { from { background: #1e2d50; border-color: #2e4070; } to { background: var(--card2); border-color: var(--border); } }
@keyframes fadeOut     { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.96); } }
@keyframes pulse-a     { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes flash-a     { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
@keyframes fadeIn      { from { opacity: 0; } to { opacity: 1; } }

.new-item   { animation: slideFadeIn 0.25s ease; }
.highlight  { animation: highlight 1s ease; }
.fade-out   { animation: fadeOut 0.25s ease forwards; }
.pulse-anim { animation: pulse-a 0.3s ease; }
.flash-anim { animation: flash-a 0.4s ease; }

/* ─── Modal ─── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }

.modal {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 22px;
  padding: 24px;
  width: 100%;
  max-width: 460px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 32px 80px rgba(0,0,0,0.6);
}

.modal-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 22px;
  letter-spacing: -0.3px;
}

/* Step indicator */
.step-indicator {
  display: flex;
  align-items: center;
  margin-bottom: 22px;
  gap: 0;
}

.step-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.step-circle {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--card2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  font-family: var(--mono);
  transition: all 0.25s;
}

.step-circle.step-active { background: var(--accent); border-color: var(--accent); color: #fff; }
.step-circle.step-done   { background: var(--green); border-color: var(--green); color: #000; }

.step-node-label {
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
  transition: color 0.25s;
}

.step-node-label.step-active { color: var(--accent); }
.step-node-label.step-done   { color: var(--green); }

.step-connector {
  flex: 1;
  height: 2px;
  background: var(--border);
  margin-bottom: 15px;
  transition: background 0.3s;
}

.step-connector.done { background: var(--green); }

.step { display: none; }
.step.active { display: block; }

/* Form */
.form-group { margin-bottom: 18px; }

.form-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  display: block;
  margin-bottom: 8px;
}

.date-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.date-row input[type=date] { flex: 1; }

.date-sep {
  color: var(--muted);
  font-size: 16px;
  flex-shrink: 0;
}

/* Sort options in modal */
.modal-sort-opts {
  display: flex;
  gap: 8px;
}

.modal-sort-opt {
  flex: 1;
  padding: 12px 10px;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: var(--card2);
  color: var(--dim);
  cursor: pointer;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  font-family: var(--sans);
  transition: all 0.18s;
  line-height: 1.4;
}

.modal-sort-opt .opt-icon { font-size: 16px; display: block; margin-bottom: 3px; }

.modal-sort-opt.selected {
  border-color: var(--accent);
  background: var(--accent-d);
  color: var(--text);
}

.modal-sort-opt:hover:not(.selected) {
  border-color: var(--border2);
  color: var(--text);
}

/* Modal buttons */
.modal-btns {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.modal-btn {
  padding: 13px 18px;
  border-radius: 13px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--sans);
  transition: all 0.18s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.modal-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; filter: none !important; }
.modal-btn:not(:disabled):hover { filter: brightness(1.1); transform: translateY(-1px); }
.modal-btn:not(:disabled):active { transform: translateY(0); }

.modal-btn.btn-cancel {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--dim);
}

.modal-btn.btn-primary {
  background: var(--accent);
  color: #fff;
  flex: 1;
}

.modal-btn.btn-confirm {
  background: var(--green);
  color: #000;
  font-weight: 700;
  flex: 1;
}

.modal-btn.btn-back {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--dim);
}

/* Preview */
.preview-meta {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.p-chip {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 12px;
  color: var(--muted);
  font-family: var(--mono);
}

.p-chip .val { color: var(--text); font-weight: 500; }

.preview-wrap {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  max-height: 280px;
  overflow-y: auto;
}

.preview-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  font-family: var(--mono);
}

.preview-table th {
  background: var(--surface);
  padding: 9px 12px;
  text-align: left;
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  position: sticky;
  top: 0;
}

.preview-table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--dim);
}

.preview-table td:last-child { color: var(--text); }

.preview-table tr.total-row td {
  border-bottom: none;
  font-weight: 700;
  color: #fff;
  background: var(--surface);
  border-top: 1px solid var(--border2);
}

.preview-table tbody tr:not(.total-row):hover td { background: var(--card2); }

.no-data {
  text-align: center;
  padding: 40px 16px;
  color: var(--muted);
  font-size: 13px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<!-- ─── Header ─── -->
<div class="app-header">
  <div class="brand">
    <div class="brand-name">⏱ Giờ Làm</div>
    <div class="brand-date" id="appDate"></div>
  </div>
  <div class="live-clock" id="liveClock"></div>
</div>

<!-- ─── Timer card ─── -->
<div class="card timer-card">
  <div class="status-row">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-label" id="statusLabel">Chưa bắt đầu</span>
  </div>
  <div class="timer-display" id="timerDisplay">00:00:00</div>
  <div class="ctrl-row">
    <button class="ctrl-btn start-btn" id="startBtn" onclick="startSession()">
      <span class="btn-icon">▶</span> Bắt đầu
    </button>
    <button class="ctrl-btn stop-btn" id="stopBtn" onclick="stopSession()">
      <span class="btn-icon">■</span> Kết thúc
    </button>
  </div>
</div>

<!-- ─── Sessions card ─── -->
<div class="card">
  <div class="section-header">
    <span class="section-title">Phiên làm việc</span>
    <div class="header-actions">
      <button class="btn-sm" onclick="undo()">Hoàn tác</button>
      <button class="btn-sm export-btn" onclick="openExportModal()">Export CSV</button>
    </div>
  </div>

  <div class="summary-bar" id="summaryBar"></div>

  <div class="sort-bar">
    <span class="sort-label">Sắp xếp</span>
    <button class="sort-chip active" id="chipAsc" onclick="setSort('asc')">↑ Cũ nhất</button>
    <button class="sort-chip" id="chipDesc" onclick="setSort('desc')">↓ Mới nhất</button>
  </div>

  <ul id="sessionList"></ul>
</div>

<!-- ─── Export Modal ─── -->
<div class="modal-overlay" id="exportModal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-title">Xuất file CSV</div>

    <!-- Step indicator -->
    <div class="step-indicator">
      <div class="step-node">
        <div class="step-circle" id="sc1">1</div>
        <div class="step-node-label" id="sl1">Khoảng thời gian</div>
      </div>
      <div class="step-connector" id="conn1"></div>
      <div class="step-node">
        <div class="step-circle" id="sc2">2</div>
        <div class="step-node-label" id="sl2">Xem trước</div>
      </div>
    </div>

    <!-- Step 1 -->
    <div class="step active" id="step1">
      <div class="form-group">
        <label class="form-label">Khoảng thời gian</label>
        <div class="date-row">
          <input type="date" id="fromDate">
          <span class="date-sep">→</span>
          <input type="date" id="toDate">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Thứ tự trong file CSV</label>
        <div class="modal-sort-opts">
          <div class="modal-sort-opt selected" id="csvSortAsc" onclick="setCsvSort('asc')">
            <span class="opt-icon">↑</span>Cũ nhất trước
          </div>
          <div class="modal-sort-opt" id="csvSortDesc" onclick="setCsvSort('desc')">
            <span class="opt-icon">↓</span>Mới nhất trước
          </div>
        </div>
      </div>
      <div class="modal-btns">
        <button class="modal-btn btn-cancel" onclick="closeModal()">Hủy</button>
        <button class="modal-btn btn-primary" onclick="goToPreview()">Xem trước</button>
      </div>
    </div>

    <!-- Step 2 -->
    <div class="step" id="step2">
      <div id="previewContent"></div>
      <div class="modal-btns">
        <button class="modal-btn btn-back" onclick="backToRange()">Quay lại</button>
        <button class="modal-btn btn-confirm" id="confirmExportBtn" onclick="doExport()">Tải xuống CSV</button>
      </div>
    </div>
  </div>
</div>

<script>
let sessions = JSON.parse(localStorage.getItem('sessions')) || [];
let history  = [];
let lastEditedIndex = null;
let sortOrder    = 'asc';
let csvSortOrder = 'asc';

/* ─── Persistence ─── */
function save() { localStorage.setItem('sessions', JSON.stringify(sessions)); }
function cloneSessions() { return JSON.parse(JSON.stringify(sessions)); }
function round15(ts) { return Math.round(ts / (15*60000)) * (15*60000); }

function toLocalISO(date) {
  const off = date.getTimezoneOffset() * 60000;
  return new Date(date - off).toISOString();
}
function toDateInput(ts) { return toLocalISO(new Date(ts)).slice(0, 10); }
function toTimeInput(ts) { return toLocalISO(new Date(ts)).slice(11, 16); }

function formatTime12(ts) {
  let d = new Date(ts), h = d.getHours(), m = d.getMinutes();
  let ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
}
function minsToH(m) { return (m / 60).toFixed(2); }

/* ─── Clock & timer ─── */
function updateClock() {
  let n = new Date();
  let pad = x => (x < 10 ? '0' : '') + x;
  document.getElementById('liveClock').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
}

function updateAppDate() {
  const days = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  let n = new Date();
  document.getElementById('appDate').textContent = days[n.getDay()] + ' · ' + n.getDate() + '/' + (n.getMonth()+1) + '/' + n.getFullYear();
}

function updateElapsed() {
  let open = sessions.find(s => !s.end);
  let el = document.getElementById('timerDisplay');
  if (!el) return;
  if (open) {
    let t = Math.floor((Date.now() - open.start) / 1000);
    let h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    el.textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    el.classList.add('active');
  } else {
    el.textContent = '00:00:00';
    el.classList.remove('active');
  }
}

/* ─── Session controls ─── */
function startSession() {
  let btn = document.getElementById('startBtn');
  btn && btn.classList.add('pulse-anim') && setTimeout(() => btn.classList.remove('pulse-anim'), 300);
  if (sessions.find(s => !s.end)) return;
  history.push(cloneSessions());
  sessions.push({ start: round15(Date.now()), end: null });
  save(); renderSessions();
}

function stopSession() {
  let btn = document.getElementById('stopBtn');
  if (btn) { btn.classList.add('flash-anim'); setTimeout(() => btn.classList.remove('flash-anim'), 400); }
  let open = sessions.find(s => !s.end);
  if (!open) return;
  history.push(cloneSessions());
  open.end = round15(Date.now());
  save(); renderSessions();
}

function undo() {
  if (!history.length) return alert('Không có gì để hoàn tác');
  sessions = history.pop();
  save(); renderSessions();
}

/* ─── Sort ─── */
function setSort(order) {
  sortOrder = order;
  document.getElementById('chipAsc').classList.toggle('active', order === 'asc');
  document.getElementById('chipDesc').classList.toggle('active', order === 'desc');
  renderSessions();
}

function setCsvSort(order) {
  csvSortOrder = order;
  document.getElementById('csvSortAsc').classList.toggle('selected', order === 'asc');
  document.getElementById('csvSortDesc').classList.toggle('selected', order === 'desc');
}

/* ─── Render sessions ─── */
function renderSessions() {
  let hasOpen = sessions.some(s => !s.end);
  let startBtn = document.getElementById('startBtn');
  let stopBtn  = document.getElementById('stopBtn');
  let dot      = document.getElementById('statusDot');
  let lbl      = document.getElementById('statusLabel');

  if (startBtn) startBtn.disabled = hasOpen;
  if (stopBtn)  stopBtn.disabled  = !hasOpen;
  if (dot) dot.classList.toggle('active', hasOpen);
  if (lbl) lbl.textContent = hasOpen ? 'Đang ghi thời gian...' : 'Chưa bắt đầu';

  // Summary bar
  let done = sessions.filter(s => s.end);
  let totalMins = done.reduce((a, s) => a + Math.round((s.end - s.start) / 60000), 0);
  let now = new Date();
  let todayMins = done.filter(s => {
    let d = new Date(s.start);
    return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }).reduce((a, s) => a + Math.round((s.end - s.start) / 60000), 0);

  document.getElementById('summaryBar').innerHTML = `
    <div class="s-chip">Tổng: <span class="val">${minsToH(totalMins)}h</span></div>
    <div class="s-chip">Hôm nay: <span class="val">${minsToH(todayMins)}h</span></div>
    <div class="s-chip">Phiên: <span class="val">${done.length}</span></div>
  `;

  // Sorted display
  let sorted = sessions.slice().sort((a, b) => sortOrder === 'asc' ? a.start - b.start : b.start - a.start);
  let list = document.getElementById('sessionList');
  list.innerHTML = '';

  if (!sorted.length) {
    list.innerHTML = `<li class="empty-state"><span class="empty-icon">⏰</span>Chưa có phiên nào.<br>Nhấn Bắt đầu để ghi thời gian.</li>`;
    return;
  }

  sorted.forEach(s => {
    let origIdx = sessions.indexOf(s);
    let li = document.createElement('li');
    li.className = 'session-item' + (!s.end ? ' open-session' : '');
    if (origIdx === lastEditedIndex) li.classList.add('highlight');

    let mins = s.end ? Math.round((s.end - s.start) / 60000) : 0;
    li.innerHTML = `
      <div class="session-fields">
        <input type="date" value="${toDateInput(s.start)}" onchange="editDate(${origIdx}, this.value)">
        <input type="time" value="${toTimeInput(s.start)}" onchange="editTime(${origIdx}, 'start', this.value)">
        <span class="session-sep">→</span>
        <input type="time" value="${s.end ? toTimeInput(s.end) : ''}" ${!s.end ? 'placeholder="--:--"' : ''} onchange="editTime(${origIdx}, 'end', this.value)">
        <span class="session-dur${!s.end ? ' live' : ''}">${s.end ? minsToH(mins) + 'h' : '●'}</span>
      </div>
      <button class="btn-del" onclick="deleteSession(${origIdx})" title="Xóa">🗑</button>
    `;
    list.appendChild(li);
  });
}

function editDate(i, value) {
  lastEditedIndex = i;
  history.push(cloneSessions());
  let s = sessions[i];
  let [y, m, d] = value.split('-');
  let start = new Date(s.start); start.setFullYear(y, m-1, d); s.start = round15(start.getTime());
  if (s.end) { let end = new Date(s.end); end.setFullYear(y, m-1, d); s.end = round15(end.getTime()); }
  save(); renderSessions();
}

function editTime(i, type, value) {
  lastEditedIndex = i;
  history.push(cloneSessions());
  let s = sessions[i];
  let base = new Date(type === 'start' ? s.start : (s.end || s.start));
  let [h, m] = value.split(':');
  base.setHours(h); base.setMinutes(m);
  if (type === 'start') s.start = round15(base.getTime());
  else s.end = round15(base.getTime());
  save(); renderSessions();
}

function deleteSession(i) {
  let sorted = sessions.slice().sort((a, b) => sortOrder === 'asc' ? a.start - b.start : b.start - a.start);
  let visIdx = sorted.findIndex(s => sessions.indexOf(s) === i);
  let list = document.getElementById('sessionList');
  let item = list.children[visIdx];
  if (item) {
    item.classList.add('fade-out');
    setTimeout(() => {
      history.push(cloneSessions());
      sessions.splice(i, 1);
      save(); renderSessions();
    }, 250);
  }
}

/* ─── Export modal ─── */
function filterRange(from, to) {
  return sessions.filter(s => s.start >= from && s.end && s.end <= to);
}

function buildCSVData(data) {
  let rows = [["Date","Start","End","Hours"]], total = 0;
  data.forEach(s => {
    let dur = Math.round((s.end - s.start) / 60000);
    total += dur;
    rows.push([new Date(s.start).toLocaleDateString(), formatTime12(s.start), formatTime12(s.end), minsToH(dur)]);
  });
  rows.push(["TOTAL","","",minsToH(total)]);
  return rows;
}

function buildCSV(rows) { return "sep=;\n" + rows.map(r => r.join(";")).join("\n"); }

function getRange() {
  let fv = document.getElementById('fromDate').value;
  let tv = document.getElementById('toDate').value;
  return {
    from: fv ? new Date(fv + "T00:00:00").getTime() : 0,
    to:   tv ? new Date(tv + "T23:59:59").getTime() : Date.now()
  };
}

function openExportModal() {
  let now = new Date(), y = now.getFullYear(), m = now.getMonth();
  document.getElementById('fromDate').value = toDateInput(new Date(y, m, 1).getTime());
  document.getElementById('toDate').value   = toDateInput(new Date(y, m+1, 0).getTime());
  setCsvSort('asc');
  setModalStep(1);
  document.getElementById('exportModal').classList.add('active');
}

function closeModal() { document.getElementById('exportModal').classList.remove('active'); }
function handleOverlayClick(e) { if (e.target === document.getElementById('exportModal')) closeModal(); }

function setModalStep(n) {
  document.getElementById('step1').classList.toggle('active', n === 1);
  document.getElementById('step2').classList.toggle('active', n === 2);
  [1, 2].forEach(i => {
    let c = document.getElementById('sc' + i);
    let l = document.getElementById('sl' + i);
    c.classList.remove('step-active','step-done');
    l.classList.remove('step-active','step-done');
    if (i < n)      { c.classList.add('step-done');   c.textContent = '✓'; l.classList.add('step-done'); }
    else if (i===n) { c.classList.add('step-active'); c.textContent = i;   l.classList.add('step-active'); }
    else            { c.textContent = i; }
  });
  document.getElementById('conn1').classList.toggle('done', n > 1);
}

function goToPreview() {
  let { from, to } = getRange();
  let data = filterRange(from, to).slice().sort((a, b) => csvSortOrder === 'asc' ? a.start - b.start : b.start - a.start);
  let content = document.getElementById('previewContent');
  let confirmBtn = document.getElementById('confirmExportBtn');

  if (!data.length) {
    content.innerHTML = '<div class="no-data">📭 Không có dữ liệu trong khoảng này</div>';
    confirmBtn.disabled = true;
  } else {
    confirmBtn.disabled = false;
    let rows = buildCSVData(data);
    let dataRows = rows.slice(1, rows.length - 1);
    let totalRow = rows[rows.length - 1];
    let totalMins = data.reduce((a, s) => a + Math.round((s.end - s.start) / 60000), 0);
    content.innerHTML = `
      <div class="preview-meta">
        <div class="p-chip"><span class="val">${data.length}</span> phiên</div>
        <div class="p-chip">Tổng <span class="val">${minsToH(totalMins)}h</span></div>
        <div class="p-chip">${csvSortOrder === 'asc' ? '↑ Cũ nhất' : '↓ Mới nhất'}</div>
      </div>
      <div class="preview-wrap">
        <table class="preview-table">
          <thead><tr><th>Ngày</th><th>Bắt đầu</th><th>Kết thúc</th><th>Giờ</th></tr></thead>
          <tbody>
            ${dataRows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
            <tr class="total-row">${totalRow.map(c => `<td>${c}</td>`).join('')}</tr>
          </tbody>
        </table>
      </div>`;
  }
  setModalStep(2);
}

function backToRange() { setModalStep(1); }

function doExport() {
  let { from, to } = getRange();
  let data = filterRange(from, to).slice().sort((a, b) => csvSortOrder === 'asc' ? a.start - b.start : b.start - a.start);
  if (!data.length) return;
  let csv = buildCSV(buildCSVData(data));
  let a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'timelog.csv';
  a.click();
  closeModal();
}

/* ─── Init ─── */
updateAppDate();
updateClock();
setInterval(updateClock, 1000);
setInterval(updateElapsed, 1000);
renderSessions();
</script>
</body>
</html>
